<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日历天气订阅生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">📅 日历天气订阅</h1>
            <p class="text-gray-500 text-sm">支持 Apple 日历, Google Calendar, Outlook</p>
        </div>

        <div class="space-y-6">
            <div>
                <label for="city" class="block text-sm font-medium text-gray-700 mb-1">城市名称</label>
                <input type="text" id="city" placeholder="例如: 南京, Beijing, Tokyo"
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>

            <button onclick="generateLink()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200 transform active:scale-95">
                生成订阅链接
            </button>

            <!-- 结果区域 -->
            <div id="result" class="hidden animate-fade-in-up">
                <div class="bg-gray-100 p-4 rounded-lg break-all text-sm font-mono text-gray-600 mb-3" id="urlDisplay">
                    https://...
                </div>
                <button onclick="copyLink()"
                    class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-2 rounded-lg transition">
                    复制链接
                </button>
                <div class="mt-4 text-xs text-gray-400 text-center">
                    <p>提示：iPhone 用户点击上方链接可直接订阅</p>
                </div>
            </div>
        </div>

        <div class="mt-8 border-t pt-4 text-center">
            <span class="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full">Status: Active</span>
        </div>
    </div>

    <script>
        function generateLink() {
            const city = document.getElementById('city').value.trim();
            if (!city) {
                alert('请输入城市名称');
                return;
            }

            // 获取当前协议和域名 (自动适配 workers.dev 或自定义域名)
            const origin = window.location.origin;
            // 构建 webcal 协议链接 (iOS 可直接打开)
            // 如果是 https，通常在日历中建议使用 https 协议，但 webcal 协议能触发 iOS 自动弹窗
            // 为了通用性，我们展示 https 链接，但在复制逻辑里可以做优化
            const fullUrl = `${origin}/calendar?city=${encodeURIComponent(city)}`;

            // 为了让 iPhone 点击直接跳转订阅，可以将 https:// 替换为 webcal://
            // 但 Cloudflare Worker 必须运行在 https 上
            const displayUrl = fullUrl.replace(/^https:\/\//, 'webcal://');

            const resultDiv = document.getElementById('result');
            const urlDisplay = document.getElementById('urlDisplay');

            urlDisplay.textContent = fullUrl;
            urlDisplay.dataset.copyUrl = fullUrl; // 存储原始 https 链接用于复制

            resultDiv.classList.remove('hidden');
        }

        function copyLink() {
            const url = document.getElementById('urlDisplay').dataset.copyUrl;
            navigator.clipboard.writeText(url).then(() => {
                alert('链接已复制！请前往日历 App 添加订阅。');
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>
</body>

</html>
